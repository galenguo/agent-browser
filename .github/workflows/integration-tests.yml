name: Integration Tests

on:
  push:
    branches: [main, "autoresearch/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-min: 10
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev,test]" pytest pytest-asyncio pyyaml aiohttp playwright
          playwright install chromium --with-deps

      - name: Run integration tests (fast tier)
        run: |
          pytest tests/integration/ \
            -m "not slow and not api and not llm" \
            -v \
            --tb=short \
            --strict-markers \
            -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: pytest-results.xml
        if-no-files-found: ignore
