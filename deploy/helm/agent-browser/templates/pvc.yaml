{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agent-browser.fullname" . }}-profiles
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-browser.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.profiles.accessMode }}
  {{- if .Values.persistence.profiles.storageClass }}
  storageClassName: {{ .Values.persistence.profiles.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.profiles.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agent-browser.fullname" . }}-logs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-browser.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.logs.accessMode }}
  {{- if .Values.persistence.logs.storageClass }}
  storageClassName: {{ .Values.persistence.logs.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.logs.size }}
{{- end }}
