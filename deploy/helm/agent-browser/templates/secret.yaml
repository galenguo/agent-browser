apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-browser.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-browser.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  OPENAI_BASE_URL: {{ .Values.secrets.openaiBaseUrl | quote }}
