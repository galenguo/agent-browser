apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-browser.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-browser.labels" . | nindent 4 }}
data:
  DEPLOYMENT_MODE: {{ .Values.deploymentMode | quote }}
  BROWSER_MODE: {{ if eq .Values.deploymentMode "all-in-one" }}"local"{{ else }}"docker"{{ end }}
  MAX_SESSIONS: {{ .Values.config.maxSessions | quote }}
  IDLE_TIMEOUT_SECONDS: {{ .Values.config.idleTimeoutSeconds | quote }}
  CDP_PORT: {{ .Values.config.cdpPort | quote }}
  CDP_BIND_ADDRESS: {{ .Values.config.cdpBindAddress | quote }}
  PROFILE_STORAGE: {{ .Values.config.profileStorage | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  HEADLESS: {{ .Values.config.headless | quote }}
