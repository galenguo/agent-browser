{{- if eq .Values.deploymentMode "all-in-one" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stealth-browser.fullname" . }}-aio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stealth-browser.labels" . | nindent 4 }}
    mode: all-in-one
spec:
  replicas: {{ .Values.aio.replicaCount }}
  selector:
    matchLabels:
      {{- include "stealth-browser.selectorLabels" . | nindent 6 }}
      mode: all-in-one
  template:
    metadata:
      labels:
        {{- include "stealth-browser.selectorLabels" . | nindent 8 }}
        mode: all-in-one
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: stealth-browser
        image: {{ include "stealth-browser.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8000
          name: api
        - containerPort: 6080
          name: novnc
        - containerPort: 5900
          name: vnc
        envFrom:
        - configMapRef:
            name: {{ include "stealth-browser.fullname" . }}-config
        - secretRef:
            name: {{ include "stealth-browser.fullname" . }}-secret
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        - name: profiles
          mountPath: /data/profiles
        - name: logs
          mountPath: /data/logs
        {{- end }}
        {{- if .Values.shm.enabled }}
        - name: shm
          mountPath: /dev/shm
        {{- end }}
        resources:
          {{- toYaml .Values.aio.resources | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: profiles
        persistentVolumeClaim:
          claimName: {{ include "stealth-browser.fullname" . }}-profiles
      - name: logs
        persistentVolumeClaim:
          claimName: {{ include "stealth-browser.fullname" . }}-logs
      {{- end }}
      {{- if .Values.shm.enabled }}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: {{ .Values.shm.size }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
