version: '3.8'

# 多用户会话架构 — 支持 2 种部署模式
#
# CloakBrowser (Chromium):
#   docker-compose --profile all-in-one up -d
#   docker-compose --profile distributed up -d

services:

  # ══════════════════════════════════════════════════════════
  # CloakBrowser All-in-One（API + Chromium 在同一容器）
  # ══════════════════════════════════════════════════════════
  all-in-one:
    profiles: ["all-in-one"]
    image: stealth-browser:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: stealth-browser
    ports:
      - "8000:8000"   # FastAPI API
      - "6080:6080"   # noVNC Web 查看器
      - "6000:5900"   # VNC 直连（映射到宿主机 6000，避免 macOS 屏幕共享冲突）
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - API_KEY=${API_KEY:-ab_f2d637aa9d3741d8f48784cb90a9b6fb}
      - DEPLOYMENT_MODE=all-in-one
      - BROWSER_MODE=local
      - MAX_SESSIONS=10
      - IDLE_TIMEOUT_SECONDS=1800
      - CDP_PORT=19222
      - HEADLESS=false
      - DISPLAY=:99
      - PROFILE_STORAGE=/data/profiles
      - LOG_LEVEL=info
      - BROWSER_PUBLIC_HOST=${BROWSER_PUBLIC_HOST:-}
      - BROWSER_PORT_OFFSET=${BROWSER_PORT_OFFSET:-0}
      - VNC_BASE_URL=${VNC_BASE_URL:-http://www.aiecho.site:8000}
      - DISPLAY_RESOLUTION=${DISPLAY_RESOLUTION:-1280x720x24}
    volumes:
      - ./data/profiles:/data/profiles
      - ./data/logs:/data/logs
    shm_size: '128mb'
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '4.0'
        reservations:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ══════════════════════════════════════════════════════════
  # CloakBrowser Distributed（API 容器 + 浏览器容器分离）
  # ══════════════════════════════════════════════════════════
  api-server:
    profiles: ["distributed"]
    image: stealth-browser-api:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    container_name: stealth-browser-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - API_KEY=${API_KEY:-ab_f2d637aa9d3741d8f48784cb90a9b6fb}
      - DEPLOYMENT_MODE=distributed
      - BROWSER_MODE=docker
      - MAX_SESSIONS=50
      - IDLE_TIMEOUT_SECONDS=1800
      - PROFILE_STORAGE=/data/profiles
      - HOST_PROFILE_PATH=${HOST_PROFILE_PATH}
      - DEBUG_CONTAINERS=${DEBUG_CONTAINERS:-false}
      - LOG_LEVEL=info
      # 配置后，创建会话时响应中将包含 browser_node 信息（IP/域名 + noVNC 端口）
      # 腾讯云等 VPC 场景：设为宿主机公网 IP 或域名，端口透传时 BROWSER_PORT_OFFSET=0
      - BROWSER_PUBLIC_HOST=${BROWSER_PUBLIC_HOST:-}
      - BROWSER_PORT_OFFSET=${BROWSER_PORT_OFFSET:-0}
    volumes:
      - ./data/profiles:/data/profiles
      - ./data/logs:/data/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - browser-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 浏览器容器由 BrowserInstancePool 动态创建
  # 需要先构建镜像: docker build -t stealth-browser-browser:latest -f docker/Dockerfile.browser ..

  # ══════════════════════════════════════════════════════════

networks:
  browser-network:
    driver: bridge
    name: stealth-browser-network
