apiVersion: v1
kind: Secret
metadata:
  name: agent-browser-secret
  namespace: agent-browser
type: Opaque
stringData:
  # ── Authentication ──

  # Multi-API-Key mode (JSON array of valid keys)
  # Each key maps to one browser pod (1 key = 1 session = 1 browser)
  # Format: JSON array or comma-separated string
  API_KEYS: '["key-alice-001","key-bob-002","key-charlie-003"]'

  # Fallback single key (used only when API_KEYS is empty/not set)
  API_KEY: "agent-browser-dev-key-change-me"

  # ── LLM Configuration ──

  # Anthropic (Claude)
  ANTHROPIC_API_KEY: "your-anthropic-api-key"
  ANTHROPIC_BASE_URL: "https://api.anthropic.com"

  # OpenAI (GPT / compatible APIs)
  OPENAI_API_KEY: "your-openai-api-key"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
