apiVersion: v1
kind: Service
metadata:
  name: agent-browser-browser
  namespace: agent-browser
  labels:
    app: agent-browser
    component: browser
    mode: distributed
spec:
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: agent-browser
    component: browser
    mode: distributed
  ports:
  - name: cdp
    port: 19222
    targetPort: 19222
    protocol: TCP
  - name: novnc
    port: 6080
    targetPort: 6080
    protocol: TCP
  - name: vnc
    port: 5900
    targetPort: 5900
    protocol: TCP
