apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-browser-browser
  namespace: agent-browser
  labels:
    app: agent-browser
    component: browser
    mode: distributed
spec:
  replicas: 3  # Adjust based on expected concurrent sessions
  selector:
    matchLabels:
      app: agent-browser
      component: browser
      mode: distributed
  template:
    metadata:
      labels:
        app: agent-browser
        component: browser
        mode: distributed
    spec:
      containers:
      - name: browser
        image: agent-browser-browser:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80          # Auth proxy (external access)
          name: auth-proxy
          protocol: TCP
        - containerPort: 6080        # noVNC (internal, behind auth proxy)
          name: novnc
          protocol: TCP
        - containerPort: 19222       # CDP (internal, API connects via cluster DNS)
          name: cdp
          protocol: TCP
        - containerPort: 5900        # VNC direct (internal)
          name: vnc
          protocol: TCP
        env:
        - name: CDP_PORT
          value: "19222"
        - name: CDP_BIND_ADDRESS
          value: "0.0.0.0"
        - name: HEADLESS
          value: "false"
        - name: PROFILE_STORAGE
          value: "/data/profiles"
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: profiles
          mountPath: /data/profiles
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
      - name: profiles
        persistentVolumeClaim:
          claimName: agent-browser-profiles
