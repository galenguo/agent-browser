apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: stealth-browser
spec:
  parentRefs:
    - name: stealth-browser-gateway
      sectionName: web    # Must match Gateway listener name
  hostnames:
    - "api.stealth-browser.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: stealth-browser-api
          port: 8000
