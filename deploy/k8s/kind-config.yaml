kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: stealth-browser
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30801
        hostPort: 30801
        protocol: TCP
      - containerPort: 30680
        hostPort: 30680
        protocol: TCP
      - containerPort: 30590
        hostPort: 30590
        protocol: TCP
    extraMounts:
      - hostPath: /var/run/docker.sock
        containerPath: /var/run/docker.sock
      - hostPath: ./deploy/k8s/data/profiles
        containerPath: /var/lib/stealth-browser/profiles
      - hostPath: ./deploy/k8s/data/logs
        containerPath: /var/lib/stealth-browser/logs
  - role: worker
  - role: worker
