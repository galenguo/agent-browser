apiVersion: v1
kind: Service
metadata:
  name: stealth-browser-br-headless
  namespace: stealth-browser
  labels:
    app: stealth-browser-br
spec:
  clusterIP: None
  selector:
    app: stealth-browser-br
  ports:
  - name: browser-api
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: novnc
    port: 6080
    targetPort: 6080
    protocol: TCP
  - name: cdp
    port: 19222
    targetPort: 19222
    protocol: TCP
