apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stealth-browser-cp
  namespace: stealth-browser
  labels:
    app: stealth-browser-cp
spec:
  serviceName: stealth-browser-cp-headless
  replicas: 1
  selector:
    matchLabels:
      app: stealth-browser-cp
  template:
    metadata:
      labels:
        app: stealth-browser-cp
    spec:
      serviceAccountName: stealth-browser-cp
      containers:
      - name: stealth-browser
        image: registry-cn-gimc-local.gimccloud.com/library/stealth-browser:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: stealth-browser-config
        - secretRef:
            name: stealth-browser-secret
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: profiles
          mountPath: /data/profiles
        - name: api-keys
          mountPath: /app/config/keys.yaml
          subPath: keys.yaml
      volumes:
      - name: api-keys
        configMap:
          name: stealth-browser-api-keys
  volumeClaimTemplates:
  - metadata:
      name: profiles
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: rook-ceph-block
      resources:
        requests:
          storage: 1Gi
