apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stealth-browser-profiles
  namespace: stealth-browser
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stealth-browser-logs
  namespace: stealth-browser
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
