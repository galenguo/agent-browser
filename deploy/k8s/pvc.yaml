apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-browser-profiles
  namespace: agent-browser
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-browser-logs
  namespace: agent-browser
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
