apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browser-route
  namespace: agent-browser
spec:
  parentRefs:
    - name: agent-browser-gateway
      sectionName: web    # Must match Gateway listener name
  hostnames:
    - "b.agent-browser.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: agent-browser-browser
          port: 80
