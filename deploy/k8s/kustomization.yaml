apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-browser

resources:
  - namespace.yaml
  # ConfigMap: use configmap-distributed for kind+Traefik deployment
  - configmap-distributed.yaml
  # Shared state ConfigMap (CAS-based distributed coordination)
  - configmap-state.yaml
  # Secret (user must create from example)
  - secret.yaml
  - pvc.yaml
  # RBAC for API Pod K8s access + state ConfigMap
  - serviceaccount.yaml
  # Distributed mode resources
  - api-deployment.yaml
  - api-service.yaml
  # Browser Deployment (K8s pool mode)
  - browser-deployment.yaml
  - browser-service.yaml
  # Gateway API routing (kind + Traefik)
  - gateway.yaml
  - httproute-api.yaml
  - httproute-browser.yaml
  # All-in-One mode (commented out)
  # - aio-deployment.yaml
  # - aio-service.yaml

# Image replacement (adjust registry as needed)
images:
  - name: ${REGISTRY_URL}/agent-browser-api
    newName: agent-browser-api
    newTag: latest
  - name: ${REGISTRY_URL}/agent-browser-browser
    newName: agent-browser-browser
    newTag: latest
