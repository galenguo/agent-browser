apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: stealth-browser-gateway
  namespace: stealth-browser
spec:
  gatewayClassName: traefik
  listeners:
    - name: web                          # Must match Traefik entrypoint name
      hostname: "*.stealth-browser.local"
      port: 8000                         # MUST be 8000 to match Traefik web entrypoint
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
