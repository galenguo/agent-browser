apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-browser-config
  namespace: agent-browser
data:
  # Deployment mode
  DEPLOYMENT_MODE: "distributed"
  BROWSER_MODE: "k8s"                    # K8s Browser Pod pool (not docker socket)

  # Session configuration
  MAX_SESSIONS: "50"
  IDLE_TIMEOUT_SECONDS: "1800"

  # CDP configuration
  CDP_PORT: "19222"
  CDP_BIND_ADDRESS: "0.0.0.0"

  # Storage configuration
  PROFILE_STORAGE: "/data/profiles"
  LOG_LEVEL: "INFO"

  # Browser configuration
  HEADLESS: "false"

  # Public access (for noVNC URL generation)
  BROWSER_PUBLIC_HOST: "agent-browser.local"
  BROWSER_PORT_OFFSET: "0"

  # Browser recycling (mixed mode)
  # Pods idle longer than this are auto-restarted to clean state
  BROWSER_IDLE_RESTART_MINUTES: "30"

  # Stealth profile: "off" (default, fast) | "balanced" | "minimal" | "full" (max anti-detection)
  AGENT_BROWSER_STEALTH_PROFILE: "off"

  # BR pod resource tuning
  BR_SHM_SIZE: "512Mi"

  # Debug
  DEBUG_CONTAINERS: "false"
