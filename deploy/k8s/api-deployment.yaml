apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-browser-api
  namespace: agent-browser
  labels:
    app: agent-browser
    component: api
    mode: distributed
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-browser
      component: api
      mode: distributed
  template:
    metadata:
      labels:
        app: agent-browser
        component: api
        mode: distributed
    spec:
      # Service account for K8s API access (pod listing)
      serviceAccountName: agent-browser-api

      containers:
      - name: api
        image: agent-browser-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: api
          protocol: TCP
        env:
        # ── Deployment mode ──
        - name: DEPLOYMENT_MODE
          value: "distributed"
        - name: BROWSER_MODE
          value: "k8s"                      # Use K8s Browser Pod pool (not docker socket)

        # ── Authentication ──
        - name: API_KEYS
          valueFrom:
            secretKeyRef:
              name: agent-browser-secret
              key: API_KEYS
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-browser-secret
              key: API_KEY

        # ── Session limits (read by get_pool()) ──
        - name: MAX_SESSIONS
          value: "50"
        - name: IDLE_TIMEOUT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: agent-browser-config
              key: IDLE_TIMEOUT_SECONDS

        # ── Storage ──
        - name: PROFILE_STORAGE
          valueFrom:
            configMapKeyRef:
              name: agent-browser-config
              key: PROFILE_STORAGE
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: agent-browser-config
              key: LOG_LEVEL

        # ── Browser recycling ──
        - name: BROWSER_IDLE_RESTART_MINUTES
          valueFrom:
            configMapKeyRef:
              name: agent-browser-config
              key: BROWSER_IDLE_RESTART_MINUTES

        # ── LLM Keys ──
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-browser-secret
              key: ANTHROPIC_API_KEY
        - name: ANTHROPIC_BASE_URL
          valueFrom:
            secretKeyRef:
              name: agent-browser-secret
              key: ANTHROPIC_BASE_URL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-browser-secret
              key: OPENAI_API_KEY
        - name: OPENAI_BASE_URL
          valueFrom:
            secretKeyRef:
              name: agent-browser-secret
              key: OPENAI_BASE_URL

        volumeMounts:
        - name: profiles
          mountPath: /data/profiles
        - name: logs
          mountPath: /data/logs
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: profiles
        persistentVolumeClaim:
          claimName: agent-browser-profiles
      - name: logs
        persistentVolumeClaim:
          claimName: agent-browser-logs
