apiVersion: apps/v1
kind: Deployment
metadata:
  name: stealth-browser-aio
  namespace: stealth-browser
  labels:
    app: stealth-browser
    mode: all-in-one
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stealth-browser
      mode: all-in-one
  template:
    metadata:
      labels:
        app: stealth-browser
        mode: all-in-one
    spec:
      containers:
      - name: stealth-browser
        image: ${REGISTRY_URL}/stealth-browser:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: api
          protocol: TCP
        - containerPort: 6080
          name: novnc
          protocol: TCP
        - containerPort: 5900
          name: vnc
          protocol: TCP
        env:
        - name: DEPLOYMENT_MODE
          valueFrom:
            configMapKeyRef:
              name: stealth-browser-config
              key: DEPLOYMENT_MODE
        - name: BROWSER_MODE
          valueFrom:
            configMapKeyRef:
              name: stealth-browser-config
              key: BROWSER_MODE
        - name: MAX_SESSIONS
          valueFrom:
            configMapKeyRef:
              name: stealth-browser-config
              key: MAX_SESSIONS
        - name: IDLE_TIMEOUT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: stealth-browser-config
              key: IDLE_TIMEOUT_SECONDS
        - name: CDP_PORT
          valueFrom:
            configMapKeyRef:
              name: stealth-browser-config
              key: CDP_PORT
        - name: CDP_BIND_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: stealth-browser-config
              key: CDP_BIND_ADDRESS
        - name: PROFILE_STORAGE
          valueFrom:
            configMapKeyRef:
              name: stealth-browser-config
              key: PROFILE_STORAGE
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: stealth-browser-config
              key: LOG_LEVEL
        - name: HEADLESS
          valueFrom:
            configMapKeyRef:
              name: stealth-browser-config
              key: HEADLESS
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: stealth-browser-secret
              key: ANTHROPIC_API_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: stealth-browser-secret
              key: OPENAI_API_KEY
        - name: OPENAI_BASE_URL
          valueFrom:
            secretKeyRef:
              name: stealth-browser-secret
              key: OPENAI_BASE_URL
        volumeMounts:
        - name: profiles
          mountPath: /data/profiles
        - name: logs
          mountPath: /data/logs
        - name: shm
          mountPath: /dev/shm
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: profiles
        persistentVolumeClaim:
          claimName: stealth-browser-profiles
      - name: logs
        persistentVolumeClaim:
          claimName: stealth-browser-logs
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
