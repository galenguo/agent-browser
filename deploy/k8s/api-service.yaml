apiVersion: v1
kind: Service
metadata:
  name: agent-browser-api
  namespace: agent-browser
  labels:
    app: agent-browser
    component: api
    mode: distributed
spec:
  type: NodePort
  selector:
    app: agent-browser
    component: api
    mode: distributed
  ports:
  - name: api
    port: 8000
    targetPort: 8000
    nodePort: 30801
    protocol: TCP
