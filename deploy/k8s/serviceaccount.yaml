# RBAC: API Pod needs permissions for K8s pool management + shared state
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stealth-browser-api
  namespace: stealth-browser
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stealth-browser-api-role
  namespace: stealth-browser
rules:
  # List/watch browser pods for pool allocation
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Read/write shared state ConfigMap (CAS-based distributed coordination)
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["stealth-browser-state"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stealth-browser-api-binding
  namespace: stealth-browser
subjects:
- kind: ServiceAccount
  name: stealth-browser-api
roleRef:
  kind: Role
  name: stealth-browser-api-role
  apiGroup: rbac.authorization.k8s.io
