{{- if eq .Values.deploymentMode "distributed" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-browser.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-browser.labels" . | nindent 4 }}
    component: api
    mode: distributed
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "agent-browser.selectorLabels" . | nindent 4 }}
    component: api
    mode: distributed
  ports:
  - name: api
    port: {{ .Values.service.api.port }}
    targetPort: 8000
    {{- if eq .Values.service.type "NodePort" }}
    nodePort: {{ .Values.service.api.nodePort }}
    {{- end }}
{{- end }}
