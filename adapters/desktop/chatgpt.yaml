app: chatgpt
type: electron
name: ChatGPT Desktop
detect: '"ChatGPT" in (window_title or process_name)'
cdp:
  auto_discover: true
  port_range: [9222, 9230]
applescript:
  activate: 'tell application "ChatGPT" to activate'
  is_running: 'application "ChatGPT" is running'
commands:
  status:
    pipeline:
      - applescript: 'application "ChatGPT" is running'
      - cdp_discover: null
  activate:
    pipeline:
      - activate: true
  screenshot:
    pipeline:
      - is_running: true
      - screenshot: true
