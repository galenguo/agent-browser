[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires running services (API server, Gateway)",
    "manual: requires human interaction (QR code scan)",
    "slow: tests that take more than 10 seconds",
    "requires_browser: requires a real CloakBrowser instance",
]
addopts = "-v --tb=short"
